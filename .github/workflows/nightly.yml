# What: every night, runs the tests where a pull request does not: on four systems and two
# Pythons, and against the newest Claude Code and Codex, and in a real browser.
# Why: the maintainer has one Mac, and nobody presses every button of the page before a release.
# A break on Linux on ARM, an Intel Mac, Python 3.13, a new client version or in the page must
# show here first, not at a user.
#
# No job here is a check on pull requests, and none holds a secret. A red job shows as one
# `ci-failure` issue, opened by the desk in kitden-sdlc and closed when the job is green again.
name: Nightly tests

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # No `name:` on purpose: kitden-sdlc reads the runs as `systems (<os>, <python>)`.
  systems:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
        python: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.10"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "25"
          package-manager-cache: false
      - run: uv sync --locked
      # UV_PYTHON wins over .python-version; stop if it did not.
      - name: The tests use the Python of this run
        env:
          WANTED: ${{ matrix.python }}
        run: |
          got="$(uv run python -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          echo "Python $got"
          test "$got" = "$WANTED"
      # Linux keeps server secrets in the desktop keyring through secret-tool.
      - name: A keyring on the session bus (Ubuntu)
        if: runner.os == 'Linux'
        # When the Ubuntu mirrors are down, fail in minutes, not in half an hour.
        timeout-minutes: 5
        run: |
          sudo apt-get update -q -o Acquire::Retries=3
          sudo apt-get install -yq -o Acquire::Retries=3 libsecret-tools gnome-keyring dbus
      # No coverage floor here: that is the pull requests' job.
      - run: uv run pytest -q
      # One real round trip through secret-tool, with the bus where a desktop session has it
      # ($XDG_RUNTIME_DIR/bus). The keyring is unlocked with a throwaway password; secret-tool
      # runs once by itself first, so a broken keyring shows its own error, not Kitden's.
      - name: The real keyring (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          XDG_RUNTIME_DIR="$(mktemp -d)"
          export XDG_RUNTIME_DIR
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          dbus-daemon --session --address="$DBUS_SESSION_BUS_ADDRESS" --fork
          printf 'kitden-ci' | gnome-keyring-daemon --unlock --components=secrets
          sleep 1
          dbus-send --session --print-reply --dest=org.freedesktop.DBus /org/freedesktop/DBus \
            org.freedesktop.DBus.ListNames | grep -q org.freedesktop.secrets
          printf 'ci' | secret-tool store --label=ci service kitden-ci account smoke
          test "$(secret-tool lookup service kitden-ci account smoke)" = ci
          secret-tool clear service kitden-ci account smoke
          KITDEN_REAL_KEYRING=1 uv run pytest -q tests/unit/test_real_keyring.py -rs
      # Release checks 17 to 21 against the real keyring. A step of its own, because the one
      # above must stay the same as in release.yml; it starts its own bus and keyring the same
      # way, unlocked with the same throwaway password.
      - name: The real keyring, release checks (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          XDG_RUNTIME_DIR="$(mktemp -d)"
          export XDG_RUNTIME_DIR
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          dbus-daemon --session --address="$DBUS_SESSION_BUS_ADDRESS" --fork
          printf 'kitden-ci' | gnome-keyring-daemon --unlock --components=secrets
          sleep 1
          dbus-send --session --print-reply --dest=org.freedesktop.DBus /org/freedesktop/DBus \
            org.freedesktop.DBus.ListNames | grep -q org.freedesktop.secrets
          KITDEN_REAL_KEYRING=1 uv run pytest -q tests/unit/test_real_secrets.py -rs
      # Release checks 17 to 21 against the real Keychain, never the runner's login one: a
      # keychain for this run in $RUNNER_TEMP, made the default, with a throwaway password and
      # no lock timeout, so `security` never asks. The tests run with HOME in a sandbox; they
      # make this keychain the list and the default there too, from KITDEN_CI_KEYCHAIN.
      - name: The real Keychain (macOS)
        if: runner.os == 'macOS'
        run: |
          chain="$RUNNER_TEMP/kitden-ci.keychain-db"
          security create-keychain -p kitden-ci "$chain"
          security set-keychain-settings "$chain"
          security unlock-keychain -p kitden-ci "$chain"
          security list-keychains -d user -s "$chain"
          security default-keychain -d user -s "$chain"
          if ! security default-keychain -d user | grep -q kitden-ci.keychain-db; then
            echo "::error::the keychain made for this run is not the default one"
            exit 1
          fi
          # TEMPORARY, remove before the pull request: a probe of `security` for the Keychain fix
          # (keychain-values). Items only under the service kitden-probe in this run's keychain,
          # all deleted at its end; it never fails the step. Its lines start with PROBE.
          chain="$chain" uv run python - <<'PY' || true
          import os
          import subprocess

          from kitden.local_gateway.keychain import _password

          SECURITY = "/usr/bin/security"
          SERVICE = "kitden-probe"
          CHAIN = os.environ["chain"]
          made = set()


          def sec(args, stdin=None):
              try:
                  done = subprocess.run(
                      [SECURITY, *args], input=stdin, capture_output=True, timeout=20, check=False
                  )
              except subprocess.TimeoutExpired:
                  return "timeout", b"", b""
              return done.returncode, done.stdout, done.stderr


          def back(account):
              """The item's value by `-w`, without the newline; None when it is not there."""
              code, out, _ = sec(["find-generic-password", "-s", SERVICE, "-a", account, "-w", CHAIN])
              return None if code != 0 else out.removesuffix(b"\n")


          def verdict(account, value):
              got = back(account)
              if got is None:
                  return "MISSING"
              if got == value.encode():
                  return f"WHOLE ({len(got)} bytes)"
              return f"CUT or CHANGED ({len(got)} of {len(value.encode())} bytes)"


          # 1. What `find-generic-password -g` prints. Probe values only, so in argv here.
          for name, value in [
              ("g-quotes", 'a "b" \\ c\'d'),
              ("g-alphabets", "ключ-héllo-日本"),
              ("g-cjk", "日本"),
              ("g-hexdigits", "cafe1234"),
              ("g-control", "a\tb\nc"),
          ]:
              made.add(name)
              code, _, err = sec(
                  ["add-generic-password", "-U", "-s", SERVICE, "-a", name, "-X", value.encode().hex(), CHAIN]
              )
              print(f"PROBE-G {name}: add exit {code} {err!r}")
              code, out, err = sec(["find-generic-password", "-s", SERVICE, "-a", name, "-g", CHAIN])
              print(f"PROBE-G {name}: -g exit {code}; stderr {err!r}")
              print(f"PROBE-G {name}: -g stdout {out!r}")
              try:
                  read = _password(err.decode())
                  print(f"PROBE-G {name}: Kitden reads {read!r}, the same: {read == value}")
              except ValueError as error:
                  print(f"PROBE-G {name}: Kitden cannot read it: {error}")
              code, out, _ = sec(["find-generic-password", "-s", SERVICE, "-a", name, "-w", CHAIN])
              print(f"PROBE-W {name}: -w exit {code}; stdout {out!r}")
          made.add("g-empty")
          code, _, err = sec(["add-generic-password", "-U", "-s", SERVICE, "-a", "g-empty", "-w", "", CHAIN])
          print(f"PROBE-G g-empty: add exit {code} {err!r}")
          code, _, err = sec(["find-generic-password", "-s", SERVICE, "-a", "g-empty", "-g", CHAIN])
          print(f"PROBE-G g-empty: -g exit {code}; stderr {err!r}")

          # 2. Write paths for a long value with the value only on stdin, never in argv.
          for size in (4096, 16384):
              value = ("kitden-probe-" * 2000)[:size]
              # 2a. `-w` as the last option: security prompts for the value (twice) and reads stdin.
              name = f"long-prompt-{size}"
              made.add(name)
              code, _, err = sec(
                  ["add-generic-password", "-U", "-s", SERVICE, "-a", name, "-w"],
                  stdin=f"{value}\n{value}\n".encode(),
              )
              print(f"PROBE-LONG prompt {size}: exit {code}; stderr {err[:300]!r}; {verdict(name, value)}")
              # 2b. The same prompt inside `security -i`: the command line, then the value lines.
              name = f"long-iprompt-{size}"
              made.add(name)
              line = f'add-generic-password -U -s {SERVICE} -a "{name}" -w\n{value}\n{value}\n'
              code, _, err = sec(["-i"], stdin=line.encode())
              print(f"PROBE-LONG -i prompt {size}: exit {code}; stderr {err[:300]!r}; {verdict(name, value)}")
              # 2c. One `security -i` command over several lines, each ending in a backslash.
              name = f"long-joined-{size}"
              made.add(name)
              hex_value = value.encode().hex()
              parts = [hex_value[at : at + 1000] for at in range(0, len(hex_value), 1000)]
              line = f'add-generic-password -U -s {SERVICE} -a "{name}" -X ' + "\\\n".join(parts) + "\n"
              code, _, err = sec(["-i"], stdin=line.encode())
              print(f"PROBE-LONG -i joined {size}: exit {code}; stderr {err[:300]!r}; {verdict(name, value)}")

          # 3. The longest `security -i` line read whole: lines of exactly `length` bytes before the
          # newline, Kitden's form with `-s kitden-probe`.
          for length in (3999, 4000, 4064, 4078, 4090, 4093, 4094, 4095, 4096, 4097, 4100, 4200, 8192):
              name = f"lim-{length}"
              start = f'add-generic-password -U -s {SERVICE} -a "{name}" -X '
              if (length - len(start)) % 2:
                  name += "x"
                  start = f'add-generic-password -U -s {SERVICE} -a "{name}" -X '
              value = ("v" * length)[: (length - len(start)) // 2]
              line = start + value.encode().hex()
              assert len(line) == length, (len(line), length)
              made.add(name)
              code, _, err = sec(["-i"], stdin=(line + "\n").encode())
              print(
                  f"PROBE-LINE {length}: -i exit {code}; stderr {err[:160]!r}; value of "
                  f"{len(value)} bytes {verdict(name, value)}"
              )

          # 4. Clean up: every item of the service, then say whether any is left.
          for name in sorted(made):
              sec(["delete-generic-password", "-s", SERVICE, "-a", name, CHAIN])
          code, _, _ = sec(["find-generic-password", "-s", SERVICE, CHAIN])
          print(f"PROBE-CLEAN: find of any {SERVICE} item exits {code} (44: none left)")
          PY
          for _ in $(seq 1 100); do
            security delete-generic-password -s kitden-probe "$chain" >/dev/null 2>&1 || break
          done
          # End of the TEMPORARY probe.
          KITDEN_REAL_KEYCHAIN=1 KITDEN_CI_KEYCHAIN="$chain" \
            uv run pytest -q tests/unit/test_real_secrets.py -rs
      # The page's own tests, in Node with a stand-in DOM.
      - run: node --test tests/frontend/*.test.mjs
      # The page opens within its time budgets (docs/development.md, Speed).
      - run: uv run python scripts/measure-start.py
      # The tests in tests/set-aside.txt fail by chance; run them to see if they still do.
      # This step never turns the job red.
      - name: Tests set aside
        continue-on-error: true
        run: |
          if ! grep -qv -e '^[[:space:]]*$' -e '^#' tests/set-aside.txt; then
            echo "No test is set aside."
            exit 0
          fi
          uv run pytest -q --set-aside=only | tee set-aside.log || true
          tail -n 1 set-aside.log >> "$GITHUB_STEP_SUMMARY"

  # No `name:` on purpose: kitden-sdlc reads the runs as `clients (<os>)`.
  clients:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.10"
          # This job runs code from outside the repository, so its own steps write no cache.
          enable-cache: false
      # Also gives the contract tests the `kitden` command, which `uv run` finds.
      - run: uv sync --locked
      # The tests need no account; stop if this runner has one, so a pass means that. Before
      # the install, because the Claude Code installer writes ~/.claude.json with no account.
      - name: No account
        run: |
          if [ -e "$HOME/.claude.json" ] || [ -e "$HOME/.codex/auth.json" ]; then
            echo "::error::this runner has a client account; the tests must run without one"
            exit 1
          fi
      # The vendors' own installers, as their docs tell users. Not pinned on purpose: this job is
      # here to meet each new client version before users do. It holds no secret and can only
      # read. Both put their command in ~/.local/bin.
      - name: Install the newest clients
        run: |
          set -o pipefail
          curl -fsSL https://claude.ai/install.sh | bash ||
            { echo "::error::Claude Code could not be installed"; exit 1; }
          curl -fsSL https://chatgpt.com/codex/install.sh | sh ||
            { echo "::error::Codex could not be installed"; exit 1; }
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The commands just installed, by their full path: never another copy on the runner.
      - name: Which versions
        run: |
          for client in claude codex; do
            if ! version="$("$HOME/.local/bin/$client" --version)"; then
              echo "::error::$client could not be installed"
              exit 1
            fi
            echo "- $client $version" >> "$GITHUB_STEP_SUMMARY"
          done
      # A missing client fails these tests here instead of skipping them. The files the clients
      # write go to KITDEN_WRITTEN (tests/contract/test_written_files.py).
      - name: The contract tests
        env:
          KITDEN_NEED_CLIENTS: "1"
          KITDEN_WRITTEN: ${{ runner.temp }}/written
        run: uv run pytest -m "contract and not signed_in" -q -rs
      # On a red night, keep those files: a new fixture folder is made from them
      # (tests/fixtures/README.md). They hold no secret: the runner has no account.
      - name: Keep the files the clients wrote
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: written-files-${{ matrix.os }}
          path: ${{ runner.temp }}/written
          if-no-files-found: ignore
          # Every file saved is a dotfile or sits in a dot-folder, left out unless asked for.
          include-hidden-files: true
          retention-days: 7

  # The page on the demo sample, in a real Chromium (tests/browser).
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.10"
      - run: uv sync --locked
      # Playwright is not a project dependency: these steps add it for this run only, at the
      # version the tests were written for, and fetch its Chromium with the system libraries.
      - name: Install Chromium
        # When the Ubuntu mirrors or the download are down, fail in minutes.
        timeout-minutes: 5
        run: uv run --with playwright==1.64.1 playwright install --with-deps chromium
      # Without Playwright the tests skip and the night looks green: stop here instead.
      - name: Playwright imports
        run: uv run --with playwright==1.64.1 python -c "import playwright"
      - name: The browser tests
        run: uv run --with playwright==1.64.1 pytest -m browser -q
