# Checks on every push to main and every pull request. A tag v<version> also builds the package,
# publishes it to PyPI and creates a GitHub release with the built files and
# docs/releases/v<version>.md as its notes.
name: Checks and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.10"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: The tag names the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - name: The tag has release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test -s "docs/releases/$GITHUB_REF_NAME.md" || {
            echo "::error::Write docs/releases/$GITHUB_REF_NAME.md before you tag"
            exit 1
          }
      - run: uv build
      - name: The built files hold the package and nothing else
        run: scripts/check-dist.sh dist
      - name: The wheel runs outside the checkout
        run: uv run --isolated --no-project --with dist/*.whl -- kitden --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # Trusted Publishing: PyPI trusts this repository, workflow and environment; no token is stored.
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.10"
          enable-cache: false
      - run: uv publish --trusted-publishing always dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release with the built files and its notes
        run: gh release create "$GITHUB_REF_NAME" dist/* --notes-file "docs/releases/$GITHUB_REF_NAME.md" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
