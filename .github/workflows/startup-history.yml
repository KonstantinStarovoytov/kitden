# What: by hand, measures the start-up time of earlier releases on the systems their build did
# not measure, for the desk page's trend in kitden-sdlc.
# Why: a release's build measured only macOS on Apple silicon and Linux on x86_64 until the
# startup job in release.yml; this fills in the Intel Mac and Linux on ARM once.
#
# Each job checks out one release tag and runs that tag's own scripts/measure-start.py. It holds
# no secret and only reads. kitden-sdlc's desk reads the times from the job's log; the job's
# name carries the system and the tag.
name: Start-up history

on:
  workflow_dispatch:
    inputs:
      tags:
        description: The release tags to measure, as a JSON list
        default: '["v0.3.0","v0.4.0","v0.5.0","v0.6.0","v0.6.1","v0.6.5","v0.7.0","v0.7.1","v0.7.2","v0.8.0","v0.9.0","v0.9.1","v0.9.2","v0.10.0","v0.10.1"]'
      systems:
        description: The runners, as a JSON list
        default: '["macos-15-intel","ubuntu-24.04-arm"]'

permissions: {}

jobs:
  startup:
    name: startup (${{ matrix.os }}, ${{ matrix.tag }})
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: ${{ fromJSON(inputs.systems) }}
        tag: ${{ fromJSON(inputs.tags) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.10"
          enable-cache: false
      - run: uv sync --locked
      # The Intel Mac is slower and gets twice the budgets, as in nightly.yml.
      - run: uv run python scripts/measure-start.py
        env:
          KITDEN_START_BUDGET_SCALE: ${{ matrix.os == 'macos-15-intel' && '2' || '1' }}
