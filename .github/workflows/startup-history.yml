# What: once, by hand, measures the start-up time of earlier releases on the Intel Mac and Linux
# on ARM, for the desk page's trend in kitden-sdlc.
# Why: their builds measured only macOS on Apple silicon and Linux on x86_64. Delete this file
# after its one run: kitden-sdlc keeps the times it read.
name: Start-up history

on:
  workflow_dispatch:

permissions: {}

jobs:
  # The job's name carries the system and the tag; kitden-sdlc reads the times from its log.
  startup:
    name: startup (${{ matrix.os }}, ${{ matrix.tag }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, ubuntu-24.04-arm]
        tag: [v0.3.0, v0.4.0, v0.5.0, v0.6.0, v0.6.1, v0.6.5, v0.7.0, v0.7.1, v0.7.2, v0.8.0,
              v0.9.0, v0.9.1, v0.9.2, v0.10.0, v0.10.1]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.10"
          enable-cache: false
      - run: uv sync --locked
      - run: uv run python scripts/measure-start.py
        env:
          KITDEN_START_BUDGET_SCALE: ${{ matrix.os == 'macos-15-intel' && '2' || '1' }}
