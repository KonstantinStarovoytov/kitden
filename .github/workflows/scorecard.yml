# What: once a week and after each push to main, OpenSSF Scorecard rates how the repository is
# kept safe: pinned actions, token rights, reviews, a security policy and more.
# Why: the findings show in the Security tab, and the score is public on scorecard.dev, so
# people can see it before they install Kitden.
#
# Publishing the score only works when the workflow keeps Scorecard's rules: an Ubuntu runner,
# no top-level env or defaults, no containers, and only the actions it allows.
name: Scorecard

on:
  schedule:
    - cron: "23 6 * * 1"
  push:
    branches: [main]

permissions: {}

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
      security-events: write # upload the findings to the Security tab
      id-token: write # publish the score to scorecard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
