# What: the owner runs it by hand and gets one pull request, `Kitden X.Y.Z`, with the release
# notes, the README, the policy edits and the version already in it.
# Why: a release takes one review and one merge, and no step is done by hand or forgotten.
#
# Run it with "Run workflow" on main, usually from the "Time for a release?" issue. Claude
# writes the notes, the README and the policy edits with read-only tools; jobs without a model
# set the version, record the README pictures, commit and open the PR with the release app.
# Merging it tags the release (release.yml).
name: Release prep

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Auto: Claude picks from the merged changes. Features: the next minor. Fixes: the next patch."
        type: choice
        options:
          - Auto
          - Features (0.X.0)
          - Fixes (0.0.X)
        default: Auto

permissions: {}

jobs:
  prepare:
    if: vars.AGENTS_ENABLED == 'true'
    uses: KonstantinStarovoytov/kitden-sdlc/.github/workflows/release-prep.yml@main
    permissions:
      contents: read # the agent and the scripts read the code
      pull-requests: read # the merged and the open PRs are read
    with:
      model: claude-sonnet-5-5
      # kitden-sdlc takes auto, minor or patch.
      version: ${{ inputs.version == 'Features (0.X.0)' && 'minor' || inputs.version == 'Fixes (0.0.X)' && 'patch' || 'auto' }}
      # Kitden's tests that the release texts must keep. Kitden owns this list.
      docs_tests: "tests/unit/test_docs_words.py tests/unit/test_hero.py tests/unit/test_plugin_package.py tests/unit/test_release_files.py"
      release_app_client_id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # A secret of the `release` environment, passed by name: only the called job that names
      # that environment (open-pr, which runs no model) gets its value.
      release_app_private_key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
