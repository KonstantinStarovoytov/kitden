# What: when a pull request changes a workflow file, runs kitden-sdlc's check on all of them:
# zizmor, actionlint and the agent-workflow rules.
# Why: the workflows hold the secrets. An unsafe change must show as a red check before it is
# merged.
name: Check agent workflows

on:
  pull_request:
    paths: [".github/workflows/**"]

permissions: {}

concurrency:
  group: agents-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    uses: KonstantinStarovoytov/kitden-sdlc/.github/workflows/check.yml@main
    permissions:
      contents: read # check out the code
