name: Check agent workflows

on:
  pull_request:
    paths: [".github/workflows/**"]

permissions: {}

concurrency:
  group: agents-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    uses: KonstantinStarovoytov/kitden-sdlc/.github/workflows/check.yml@2d4153888117760f04e01542d187f447a68d54e0
    permissions:
      contents: read # check out the code
