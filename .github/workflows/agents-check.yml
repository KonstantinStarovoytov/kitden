name: Check agent workflows

on:
  pull_request:
    paths: [".github/workflows/**"]

permissions: {}

concurrency:
  group: agents-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    uses: KonstantinStarovoytov/kitden-agents/.github/workflows/check.yml@ba2b1ac4b99c11d73d58ca624e08af54b4959a9b
    permissions:
      contents: read # check out the code
