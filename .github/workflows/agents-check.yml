# What: when a pull request changes a workflow file, runs kitden-sdlc's check on all of them:
# zizmor, actionlint and the rule checker for 7 of the 11 rules in kitden-sdlc's RULES.md.
# Why: the workflows hold the secrets. This shows the unsafe changes these tools know as a red
# check before the merge.
name: Check the workflows

on:
  pull_request:
    paths: [".github/workflows/**"]

permissions: {}

concurrency:
  group: agents-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    uses: KonstantinStarovoytov/kitden-sdlc/.github/workflows/check.yml@main
    permissions:
      contents: read # check out the code
