name: Check agent workflows

on:
  pull_request:
    paths: [".github/workflows/**"]

permissions: {}

concurrency:
  group: agents-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    uses: KonstantinStarovoytov/kitden-sdlc/.github/workflows/check.yml@f63877b0cfcb4662c0e5ff8b77563262aeb4873f
    permissions:
      contents: read # check out the code
