name: Check agent workflows

on:
  pull_request:
    paths: [".github/workflows/**"]

permissions: {}

concurrency:
  group: agents-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    uses: KonstantinStarovoytov/kitden-agents/.github/workflows/check.yml@9d6bdb6497ee95cb13573598d9285278e29698de
    permissions:
      contents: read # check out the code
