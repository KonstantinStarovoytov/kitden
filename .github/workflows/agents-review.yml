name: Agent review

on:
  pull_request:
    branches: [main] # judged by main's PRINCIPLES.md and AGENTS.md
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: agents-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Only with the switch on, only for branches in this repository, never for bots,
    # drafts, or pull requests labelled no-agent-review.
    if: >-
      vars.AGENTS_ENABLED == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !endsWith(github.actor, '[bot]')
      && !github.event.pull_request.draft
      && !contains(github.event.pull_request.labels.*.name, 'no-agent-review')
    uses: KonstantinStarovoytov/kitden-sdlc/.github/workflows/review.yml@main
    permissions:
      contents: read # the reviewers read the code
      pull-requests: write # one comment is posted
      actions: read # today's runs are counted
    with:
      model: claude-sonnet-5-5
      app_client_id: ${{ vars.AGENTS_APP_CLIENT_ID }} # the Lantern app posts the comment
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      app_private_key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
