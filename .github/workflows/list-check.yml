# What: when a pull request changes docs/clients.md, runs kitden-sdlc's list check: each row
# it adds or changes is checked against the row's doc page.
# Why: a row that no page backs should be seen while the pull request is open. The check only
# warns; it never turns red for a missing word.
name: Check the list against the docs

on:
  pull_request:
    paths: [docs/clients.md]

permissions: {}

concurrency:
  group: list-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    uses: KonstantinStarovoytov/kitden-sdlc/.github/workflows/list-check.yml@main
    permissions:
      contents: read # check out the code
