# What: every day, with no model, opens, updates or closes two issues: "Time for a release?"
# while merged changes for users wait and the last release is a week old or one of them has
# the `bug` label, and "Release vX.Y.Z is not everywhere" while a store is behind.
# Why: so that merged work does not sit unreleased, and a release that reached only some stores
# is noticed.
#
# Lantern, the app that posts comments and issues, opens them (the same app, variable and
# secret names as agents-review.yml).
name: Release watch

on:
  schedule:
    - cron: "23 6 * * *" # every day, at a quiet minute
  workflow_dispatch:

permissions: {}

jobs:
  watch:
    if: vars.AGENTS_ENABLED == 'true'
    uses: KonstantinStarovoytov/kitden-sdlc/.github/workflows/release-watch.yml@main
    permissions: {}
    with:
      app_client_id: ${{ vars.AGENTS_APP_CLIENT_ID }}
    secrets:
      app_private_key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
