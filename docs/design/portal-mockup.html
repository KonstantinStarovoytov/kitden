<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent setup — design mockup</title>
<!-- Throwaway mockup with test data. Not the product. -->
<style>
:root {
  color-scheme: light;
  --canvas: #f6f7f9;
  --panel: #ffffff;
  --panel-raised: #ffffff;
  --inset: #f0f2f5;
  --ink: #161a21;
  --ink-2: #464d5b;
  --ink-3: #6f7685;
  --ink-4: #a2a8b4;
  --wire: rgba(22, 30, 46, 0.10);
  --wire-soft: rgba(22, 30, 46, 0.06);
  --wire-strong: rgba(22, 30, 46, 0.18);
  --route: #2b62e3;          /* the gateway path; the one accent */
  --route-soft: rgba(43, 98, 227, 0.10);
  --lamp-on: #1c8a4c;
  --lamp-warn: #a8640b;
  --lamp-warn-soft: rgba(168, 100, 11, 0.10);
  --lamp-off: #9aa1ad;
  --danger: #c23b3b;
  --focus: rgba(43, 98, 227, 0.45);
  --shadow-pop: 0 0 0 1px var(--wire), 0 8px 24px rgba(16, 24, 40, 0.10);
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;

  /* Motion: crisp for a working tool. Entering = ease-out, moving = ease-in-out. */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --t-press: 120ms;
  --t-fast: 180ms;
  --t-panel: 320ms;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --canvas: #0f1115;
  --panel: #14171c;
  --panel-raised: #1a1e24;
  --inset: #0c0e11;
  --ink: #e7e9ee;
  --ink-2: #b4bac6;
  --ink-3: #858c99;
  --ink-4: #5b616d;
  --wire: rgba(255, 255, 255, 0.08);
  --wire-soft: rgba(255, 255, 255, 0.05);
  --wire-strong: rgba(255, 255, 255, 0.16);
  --route: #6f9bff;
  --route-soft: rgba(111, 155, 255, 0.14);
  --lamp-on: #47c27a;
  --lamp-warn: #e0a347;
  --lamp-warn-soft: rgba(224, 163, 71, 0.12);
  --lamp-off: #6b717d;
  --danger: #f07070;
  --focus: rgba(111, 155, 255, 0.5);
  --shadow-pop: 0 0 0 1px var(--wire-strong), 0 12px 32px rgba(0, 0, 0, 0.45);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--canvas); color: var(--ink);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--ink-3); }
.faint { color: var(--ink-4); }
.skip { position: absolute; left: -999px; }
.skip:focus { left: 12px; top: 12px; z-index: 50; background: var(--panel); padding: 6px 10px; }

/* Shell */
.shell { display: grid; grid-template-columns: 216px minmax(0, 1fr); height: 100vh; }
.rail { border-right: 1px solid var(--wire); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
.brand { display: flex; align-items: center; gap: 8px; padding: 4px 8px 14px; font-weight: 600; letter-spacing: -0.01em; }
.brand-mark { width: 18px; height: 18px; border-radius: 5px; background: var(--ink); position: relative; }
.brand-mark::after { content: ""; position: absolute; inset: 5px 4px; border-top: 2px solid var(--canvas); border-bottom: 2px solid var(--canvas); }
.nav a { display: flex; align-items: center; justify-content: space-between; height: 30px; padding: 0 8px; border-radius: 6px; color: var(--ink-2); text-decoration: none; transition: background-color var(--t-fast) ease, color var(--t-fast) ease; }
.nav a:hover { background: var(--wire-soft); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--wire); font-weight: 500; }
.count { font-size: 11px; color: var(--ink-3); }
.count.warn { color: var(--lamp-warn); font-weight: 600; }
.rail-foot { margin-top: auto; padding: 8px; display: grid; gap: 8px; color: var(--ink-3); font-size: 12px; }
.rail-foot button { justify-self: start; }

/* Number roller: old value leaves upward, new arrives from below. */
.roll { display: inline-grid; overflow: hidden; height: 1.45em; vertical-align: bottom; }
.roll > span { grid-area: 1 / 1; }

.content { overflow: auto; position: relative; }
.topbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--canvas) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--wire-soft); display: flex; align-items: center; gap: 12px; padding: 10px 24px; }
/* Rescan feedback: a thin line sweeps under the top bar. */
.topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: linear-gradient(90deg, transparent, var(--route), transparent); transform: translateX(-100%); opacity: 0; }
.topbar.scanning::after { opacity: 1; animation: sweep 900ms var(--ease-in-out) infinite; }
@keyframes sweep { to { transform: translateX(100%); } }
.page { padding: 20px 24px 48px; max-width: 1180px; view-transition-name: page; }
h1 { font-size: 18px; margin: 0; letter-spacing: -0.015em; font-weight: 600; }
h2 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
.lede { color: var(--ink-2); margin: 4px 0 18px; max-width: 70ch; }

/* Controls */
.btn { position: relative; height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--wire-strong); background: var(--panel); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: background-color var(--t-fast) ease, transform var(--t-press) var(--ease-out), opacity var(--t-fast) ease; }
.btn:hover { background: var(--inset); }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--ink); color: var(--canvas); border-color: transparent; }
.btn.primary:hover { opacity: 0.9; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--wire-soft); color: var(--ink); }
.btn.small { height: 24px; padding: 0 8px; font-size: 12px; }
.btn .label { transition: filter var(--t-fast) ease, opacity var(--t-fast) ease; }
.btn .label.swap { filter: blur(2px); opacity: 0; }
.spinner { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid currentColor; border-right-color: transparent; animation: spin 600ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.check path { stroke-dasharray: 20; stroke-dashoffset: 20; animation: draw 320ms var(--ease-out) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.kbd { font-family: var(--mono); font-size: 11px; padding: 0 5px; border: 1px solid var(--wire); border-radius: 4px; color: var(--ink-3); }
.search { flex: 1; max-width: 420px; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 7px; background: var(--inset); border: 1px solid var(--wire-soft); color: var(--ink-3); }
.search input { border: 0; background: transparent; outline: none; flex: 1; color: var(--ink); }
.scope { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--wire); border-radius: 7px; background: var(--panel); cursor: pointer; max-width: 360px; }
.seg { display: inline-flex; padding: 2px; background: var(--inset); border-radius: 7px; border: 1px solid var(--wire-soft); }
.seg button { height: 24px; padding: 0 10px; border: 0; background: transparent; border-radius: 5px; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--wire); font-weight: 500; }

/* Client monograms: neutral, not brand logos */
.chip { display: inline-flex; align-items: center; gap: 6px; }
.mono-mark { width: 20px; height: 20px; border-radius: 5px; display: inline-grid; place-items: center; font: 600 10px/1 var(--mono); border: 1px solid var(--wire-strong); color: var(--ink-2); background: var(--panel); flex: none; }

/* Sockets: the signature. Shape, colour and a word all carry the state.
   The fill is a pseudo-element, so a state change can drain or fill it with a transform. */
.socket { display: inline-flex; align-items: center; gap: 6px; min-width: 0; transition: color 320ms ease; }
.dot { position: relative; width: 10px; height: 10px; border-radius: 50%; flex: none; border: 1.5px solid currentColor; overflow: hidden; transition: border-radius 320ms var(--ease-in-out); }
.dot::after { content: ""; position: absolute; inset: 0; background: currentColor; transform: scale(0); transition: transform 380ms var(--ease-in-out); }
.s-on { color: var(--lamp-on); } .s-on .dot::after { transform: scale(1); }
.s-gw { color: var(--route); } .s-gw .dot { border-radius: 3px; } .s-gw .dot::after { transform: scale(1); }
.s-off { color: var(--lamp-off); }
.s-over { color: var(--ink-3); } .s-over .dot { background: linear-gradient(135deg, transparent 44%, currentColor 45% 55%, transparent 56%); }
.s-unk { color: var(--lamp-warn); } .s-unk .dot { border-style: dashed; }
.s-none { color: var(--ink-4); }
.socket .word { color: var(--ink-2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: filter var(--t-fast) ease, opacity var(--t-fast) ease; }
.socket .where { color: var(--ink-3); font-size: 11px; transition: filter var(--t-fast) ease, opacity var(--t-fast) ease; }
.socket .swap { filter: blur(2px); opacity: 0; }
.socket.pulse .dot { animation: ping 900ms var(--ease-out) 1; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 currentColor; } 100% { box-shadow: 0 0 0 7px transparent; } }

/* Entrance used once per view: rise and fade, staggered. */
.rise { animation: rise 380ms var(--ease-out) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

/* Overview */
.overview { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
.attention { display: grid; gap: 8px; }
.issue { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 4px 12px; padding: 14px 16px; background: var(--panel); border: 1px solid var(--wire); border-radius: 8px; align-items: start; }
.issue .ico { margin-top: 1px; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--lamp-warn); color: var(--lamp-warn); display: grid; place-items: center; font: 700 11px/1 var(--sans); }
.issue h3 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: -0.005em; }
.issue p { margin: 2px 0 0; color: var(--ink-2); grid-column: 2; }
.issue .actions { grid-row: 1 / span 2; grid-column: 3; display: flex; gap: 6px; }
.issue.warn { border-color: color-mix(in srgb, var(--lamp-warn) 35%, var(--wire)); }
.notes-toggle { justify-self: start; margin-top: 4px; }
.side { display: grid; gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--wire); border-radius: 8px; padding: 12px 14px; }
.card h2 { display: flex; justify-content: space-between; align-items: baseline; }
.client-row { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--wire-soft); }
.client-row:first-of-type { border-top: 0; }
.client-row .name { font-weight: 500; }
.client-row .meta { color: var(--ink-3); font-size: 12px; }
.bar { height: 6px; border-radius: 3px; background: var(--inset); overflow: hidden; margin: 6px 0; }
.bar span { display: block; height: 100%; width: 100%; background: var(--route); transform-origin: left; transform: scaleX(var(--fill, 0)); transition: transform 700ms var(--ease-out); }
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 7px 0; border-top: 1px solid var(--wire-soft); align-items: center; }
.feed li:first-child { border-top: 0; }

/* Load map */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.tabs { position: relative; display: flex; gap: 2px; border-bottom: 1px solid var(--wire); margin-bottom: 12px; }
.tabs button { border: 0; background: transparent; padding: 8px 10px; color: var(--ink-3); cursor: pointer; transition: color var(--t-fast) ease; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 500; }
.tabs .count { margin-left: 4px; }
/* One ink line glides between tabs instead of each tab drawing its own. */
.tab-ink { position: absolute; left: 0; bottom: -1px; height: 2px; width: 1px; background: var(--ink); transform-origin: left; }
table.map { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--panel); border: 1px solid var(--wire); border-radius: 8px; overflow: hidden; table-layout: fixed; }
.map th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12px; padding: 0 12px; height: 34px; border-bottom: 1px solid var(--wire); background: var(--panel); }
.map td { padding: 0 12px; height: 34px; border-bottom: 1px solid var(--wire-soft); overflow: hidden; transition: background-color 120ms ease; }
.map tr:last-child td { border-bottom: 0; }
.map tbody tr { cursor: pointer; }
.map tbody tr:hover td { background: var(--inset); }
.map tbody tr[aria-selected="true"] td { background: var(--route-soft); }
.map .item { display: flex; align-items: center; gap: 8px; min-width: 0; }
.map .item .mono { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flag { flex: none; font-size: 11px; padding: 0 6px; border-radius: 10px; line-height: 18px; background: var(--lamp-warn-soft); color: var(--lamp-warn); font-weight: 500; }
.flag.info { background: var(--wire-soft); color: var(--ink-3); font-weight: 400; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink-3); font-size: 12px; margin-top: 10px; }

/* Gateway: a route diagram where traffic visibly flows through one point. */
.gw-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.gw-url { font-family: var(--mono); font-size: 13px; color: var(--ink); }
.routes { width: 100%; max-width: 640px; height: auto; display: block; margin: 12px 0 4px; }
.routes .wire { fill: none; stroke: var(--wire-strong); stroke-width: 1.5; }
.routes .flow { fill: none; stroke: var(--route); stroke-width: 1.5; stroke-dasharray: 3 9; stroke-linecap: round; animation: flow 1.6s linear infinite; }
.routes .flow.slow { animation-duration: 2.1s; } .routes .flow.mid { animation-duration: 1.8s; }
@keyframes flow { to { stroke-dashoffset: -24; } }
.routes .node { fill: var(--panel); stroke: var(--wire-strong); }
.routes .hub { fill: var(--route-soft); stroke: var(--route); }
.routes text { fill: var(--ink); font: 600 11px var(--mono); }
.routes .sub { fill: var(--ink-3); font: 400 11px var(--sans); }
.group-title { margin: 24px 0 2px; }
.group-note { margin: 0 0 10px; color: var(--ink-3); }
.list { background: var(--panel); border: 1px solid var(--wire); border-radius: 8px; }
.list-row { display: grid; grid-template-columns: 24px minmax(0, 1.2fr) minmax(0, 1.6fr) auto; gap: 12px; align-items: center; padding: 0 12px; height: 40px; border-top: 1px solid var(--wire-soft); }
.list-row:first-child { border-top: 0; }
.list-row .path { color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conn { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.conn .cell { border: 1px solid var(--wire-soft); border-radius: 6px; padding: 10px 12px; background: var(--canvas); display: grid; gap: 6px; justify-items: start; }

/* Drawer: details and review share one surface on the right. */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(10, 12, 16, 0.22); opacity: 0; pointer-events: none; transition: opacity var(--t-panel) ease; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--panel-raised); box-shadow: var(--shadow-pop); transform: translateX(104%); transition: transform var(--t-panel) var(--ease-drawer); display: flex; flex-direction: column; overscroll-behavior: contain; }
.drawer.open { transform: none; }
.drawer.instant, .scrim.instant { transition: none; }
.drawer header { padding: 16px 20px 12px; border-bottom: 1px solid var(--wire); display: grid; gap: 4px; }
.drawer header .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.drawer .body { flex: 1; padding: 16px 20px; overflow: auto; display: grid; gap: 18px; align-content: start; }
.drawer.open .body > * { animation: rise 360ms var(--ease-out) both; }
.drawer.open .body > *:nth-child(2) { animation-delay: 40ms; }
.drawer.open .body > *:nth-child(3) { animation-delay: 80ms; }
.drawer.open .body > *:nth-child(n+4) { animation-delay: 120ms; }
.drawer footer { padding: 12px 20px; border-top: 1px solid var(--wire); display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.drawer footer .note { margin-right: auto; color: var(--ink-3); font-size: 12px; }
.title-mono { font-family: var(--mono); font-size: 17px; font-weight: 600; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.kicker { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 500; }
.stack { display: grid; gap: 0; border: 1px solid var(--wire); border-radius: 8px; overflow: hidden; }
.layer { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--wire-soft); align-items: start; }
.layer:first-child { border-top: 0; }
.layer.wins { background: var(--route-soft); }
.layer .why { color: var(--ink-3); font-size: 12px; }
.badge { font-size: 11px; padding: 0 6px; line-height: 18px; border-radius: 4px; border: 1px solid var(--wire); color: var(--ink-2); white-space: nowrap; }
.badge.win { border-color: var(--route); color: var(--route); }
.step { border: 1px solid var(--wire); border-radius: 8px; overflow: hidden; }
.step-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.step-head .file { margin-left: auto; color: var(--ink-3); }
pre.diff { margin: 0; padding: 10px 12px; background: var(--inset); border-top: 1px solid var(--wire-soft); font: 12px/1.6 var(--mono); overflow: auto; }
pre.diff .add { color: var(--lamp-on); }
pre.diff .del { color: var(--danger); }
.callout { display: flex; gap: 8px; padding: 10px 12px; border-radius: 8px; background: var(--lamp-warn-soft); color: var(--ink-2); }
.checklist { margin: 0; padding-left: 18px; color: var(--ink-2); }

/* Toast with an undo countdown that pauses while the pointer is on it. */
.toast { position: fixed; z-index: 30; left: 50%; bottom: 20px; transform: translate(-50%, 140%); visibility: hidden; background: var(--ink); color: var(--canvas); border-radius: 10px; padding: 8px 8px 8px 14px; display: flex; gap: 12px; align-items: center; overflow: hidden; transition: transform var(--t-panel) var(--ease-out), visibility 0s linear var(--t-panel); }
.toast.show { transform: translate(-50%, 0); visibility: visible; transition: transform var(--t-panel) var(--ease-out), visibility 0s; }
.toast .btn { background: transparent; color: var(--canvas); border-color: color-mix(in srgb, var(--canvas) 35%, transparent); }
.toast .timer { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--route); transform-origin: left; }
.toast.show .timer { animation: countdown 6s linear forwards; }
.toast:hover .timer { animation-play-state: paused; }
@keyframes countdown { from { transform: scaleX(1); } to { transform: scaleX(0); } }

.empty { padding: 32px; text-align: center; color: var(--ink-3); background: var(--panel); border: 1px dashed var(--wire-strong); border-radius: 8px; }
.timeline .feed li { grid-template-columns: 120px minmax(0, 1fr) auto auto; padding: 10px 12px; }

/* Page changes cross-fade with a small rise (View Transitions, where supported). */
::view-transition-old(page) { animation: 140ms ease both fade-out; }
::view-transition-new(page) { animation: 260ms var(--ease-out) both rise; }
@keyframes fade-out { to { opacity: 0; } }
/* The theme switch reveals the new theme in a circle from the button; see switchTheme(). */
html.theme-switch::view-transition-old(root), html.theme-switch::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
html.theme-switch::view-transition-old(page), html.theme-switch::view-transition-new(page) { animation: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-property: opacity, color, background-color !important; }
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
}
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .rail { display: none; }
  .overview { grid-template-columns: 1fr; }
  .conn { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <nav class="rail" aria-label="Main">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Agent setup</div>
    <div class="nav">
      <a href="#overview" data-view="overview">Overview <span class="count warn roll" id="nav-attn"><span>3</span></span></a>
      <a href="#map" data-view="map">Load map <span class="count">194</span></a>
      <a href="#gateway" data-view="gateway">Gateway <span class="count">11 around</span></a>
      <a href="#changes" data-view="changes">Changes <span class="count roll" id="nav-changes"><span>3</span></span></a>
    </div>
    <div class="rail-foot">
      <span>Scanned <span id="scanned">18:32</span> · <button class="btn ghost small" type="button" id="rescan">Rescan</button></span>
      <span>Agents can ask: <a href="#agents" data-view="agents" class="muted">show my setup</a></span>
      <button class="btn small" type="button" id="theme">Dark theme</button>
    </div>
  </nav>

  <div class="content">
    <div class="topbar" id="topbar">
      <button class="scope" type="button" title="Choose where to look">
        <span class="muted">Where:</span><span>Everywhere</span><span class="faint">▾</span>
      </button>

<script>

const reduced = matchMedia("(prefers-reduced-motion: reduce)");
const CLIENTS = [

  { kind: "mcp", name: "agentsetup", cells: { cc: ["none"], cx: ["on", "you"], cu: ["none"] }, flag: "Read-only, this tool", info: true },
  { kind: "plugin", name: "superpowers", cells: { cc: ["on", "you"], cx: ["none"], cu: ["on", "claude"] }, flag: "Cursor loads it twice" },
  { kind: "plugin", name: "claude-md-management", cells: { cc: ["off", "you"], cx: ["none"], cu: ["none"] } },
  { kind: "plugin", name: "browser", cells: { cc: ["none"], cx: ["on", "you"], cu: ["none"] } },
  { kind: "plugin", name: "github", cells: { cc: ["none"], cx: ["unk", "account"], cu: ["none"] } },
  { kind: "plugin", name: "create-plugin", cells: { cc: ["none"], cx: ["none"], cu: ["on", "you"] } },

const $ = (sel) => document.querySelector(sel);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const state = { view: "overview", kind: "mcp", only: "all", selected: null, seen: new Set(), ink: null, changed: null, undo: null };

// Motion helpers ----------------------------------------------------------------------
function animate(node, keyframes, options) {
  if (reduced.matches || !node.animate) return null;
  return node.animate(keyframes, { easing: "cubic-bezier(0.23, 1, 0.32, 1)", ...options });
}
// Run a DOM change as a View Transition when the browser has it; otherwise just run it.
function transition(change, extraClass) {
  if (!document.startViewTransition || reduced.matches || document.hidden) { change(); return null; }
  if (extraClass) document.documentElement.classList.add(extraClass);
  const t = document.startViewTransition(change);
  // A skipped transition (for example in a background tab) still runs the change; stay quiet.
  t.ready.catch(() => {});
  t.finished.catch(() => {}).finally(() => extraClass && document.documentElement.classList.remove(extraClass));
  return t;
}
// Numbers roll: the old value slides up and out, the new one slides in from below.
function rollTo(holder, value) {
  const old = holder.lastElementChild;
  if (!old || old.textContent === String(value)) return;
  const next = el("span", null, String(value)); holder.append(next);
  const up = Number(value) > Number(old.textContent) ? -1 : 1;
  animate(old, [{ transform: "translateY(0)", opacity: 1 }, { transform: `translateY(${-100 * up}%)`, opacity: 0 }], { duration: 300, fill: "forwards" });
  animate(next, [{ transform: `translateY(${100 * up}%)`, opacity: 0 }, { transform: "translateY(0)", opacity: 1 }], { duration: 300 });
  // Remove by time, not by animation end: hidden tabs may never finish an animation.
  setTimeout(() => old.remove(), reduced.matches ? 0 : 320);
}

function socket([s, where]) {
  const wrap = el("span", `socket s-${s}`);
  if (s === "none") { wrap.append(el("span", "word faint", "—")); wrap.setAttribute("aria-label", "Not set up"); return wrap; }
  const dot = el("span", "dot"); dot.setAttribute("aria-hidden", "true");
  wrap.append(dot, el("span", "word", STATE_WORD[s]));
  if (where) wrap.append(el("span", "where", WHERE[where]));
  return wrap;
}
// Morph a socket from one state to another: the fill drains or fills, the words blur across.
function morphSocket(node, [s, where]) {
  for (const t of node.querySelectorAll(".word, .where")) t.classList.add("swap");
  setTimeout(() => {
    node.className = `socket s-${s} pulse`;
    node.querySelector(".word").textContent = STATE_WORD[s];
    const w = node.querySelector(".where"); if (w) w.textContent = WHERE[where] || "";
    requestAnimationFrame(() => { for (const t of node.querySelectorAll(".swap")) t.classList.remove("swap"); });
  }, 160);
}
function mark(client) { const m = el("span", "mono-mark", client.mark); m.title = client.name; m.setAttribute("aria-hidden", "true"); return m; }
function h2(text, aside) { const h = el("h2"); h.append(el("span", null, text)); if (aside) h.append(el("span", "count", aside)); return h; }
// First visit to a view: its blocks rise in, 45 ms apart. Later visits are instant.
function entrance(nodes) {
  if (state.seen.has(state.view)) return;
  nodes.forEach((n, i) => { n.classList.add("rise"); n.style.animationDelay = `${i * 45}ms`; });
}

// Views ---------------------------------------------------------------------------------
function viewOverview(main) {
  const n = ATTENTION.length;
  main.append(el("h1", null, n ? `${n} thing${n > 1 ? "s" : ""} need${n > 1 ? "" : "s"} attention` : "All clear"));
  main.append(el("p", "lede", "Everything else looks fine: 3 clients found, 194 items, 28 projects. Your MCP gateway reaches all three clients."));
  const grid = el("div", "overview");
  const left = el("section", "attention"); left.setAttribute("aria-label", "Needs attention");
  const cards = [];
  for (const a of ATTENTION) {
    const card = el("article", `issue ${a.level}`); card.dataset.id = a.id;
    const ico = el("span", "ico", "!"); ico.setAttribute("aria-hidden", "true");
    card.append(ico, el("h3", null, a.title));
    const actions = el("div", "actions");
    const b = el("button", "btn small", a.action); b.type = "button";
    b.addEventListener("click", () => a.view ? go(a.view) : (go("map", { kind: kindOf(a.item) }), openItem(ITEMS.find((i) => i.name === a.item))));
    actions.append(b); card.append(actions, el("p", null, a.text));
    left.append(card); cards.push(card);
  }
  const notes = el("button", "btn ghost small notes-toggle", "Show 34 notes (nothing to fix)"); notes.type = "button";
  left.append(notes);
  grid.append(left);

  const side = el("div", "side");
  const clients = el("section", "card"); clients.append(h2("Clients", "3 found"));
  for (const c of CLIENTS) {
    const row = el("div", "client-row");
    const info = el("div"); info.append(el("div", "name", c.name), el("div", "meta", `${c.version} · ${c.note}`));
    const ok = el("span", "socket s-on"); const d = el("span", "dot"); d.setAttribute("aria-hidden", "true"); ok.append(d, el("span", "word", "Tested"));
    row.append(mark(c), info, ok); clients.append(row);
  }
  const gw = el("section", "card"); gw.append(h2("Gateway", "MetaMCP"));
  gw.append(el("p", null, "3 of 14 MCP servers go through the gateway."));
  const bar = el("div", "bar"); const fill = el("span"); bar.append(fill); gw.append(bar);
  requestAnimationFrame(() => requestAnimationFrame(() => fill.style.setProperty("--fill", "0.21")));
  gw.append(el("p", "muted", "4 more can move in. 6 must stay on this Mac."));
  const recent = el("section", "card"); recent.append(h2("Recent changes", ""));
  const ul = el("ul", "feed");
  for (const [time, text] of CHANGES.slice(0, 3)) { const li = el("li"); li.append(el("span", null, text), el("span", "muted", time.replace("Today ", ""))); ul.append(li); }
  recent.append(ul);
  side.append(clients, gw, recent);
  grid.append(side); main.append(grid);
  entrance([...cards, clients, gw, recent]);
}

function kindOf(name) { return (ITEMS.find((i) => i.name === name) || {}).kind || "mcp"; }

function viewMap(main) {
  main.append(el("h1", null, "Load map"));
  main.append(el("p", "lede", "What each client loads, side by side. Choose a project above to see that project's view; click a row for where it comes from."));
  const tabs = el("div", "tabs"); tabs.setAttribute("role", "tablist");
  for (const k of KINDS) {
    const n = ITEMS.filter((i) => i.kind === k.id).length;
    const t = el("button", null, k.label); t.type = "button"; t.setAttribute("role", "tab"); t.dataset.kind = k.id;
    t.setAttribute("aria-selected", String(state.kind === k.id));
    t.append(el("span", "count", String(n)));
    t.addEventListener("click", () => { state.kind = k.id; render(); });
    tabs.append(t);
  }
  const ink = el("span", "tab-ink"); ink.setAttribute("aria-hidden", "true"); tabs.append(ink);
  main.append(tabs);
  requestAnimationFrame(() => placeInk(tabs, ink));

  const bar = el("div", "toolbar");
  const seg = el("div", "seg"); seg.setAttribute("role", "group"); seg.setAttribute("aria-label", "Show");
  for (const [id, label] of [["all", "All"], ["problems", "Needs attention"], ["diff", "Differs between clients"]]) {
    const b = el("button", null, label); b.type = "button"; b.setAttribute("aria-pressed", String(state.only === id));
    b.addEventListener("click", () => { state.only = id; render(); }); seg.append(b);
  }
  bar.append(seg); main.append(bar);

  let rows = ITEMS.filter((i) => i.kind === state.kind);
  if (state.only === "problems") rows = rows.filter((i) => i.flag && !i.info);
  if (state.only === "diff") rows = rows.filter((i) => new Set(Object.values(i.cells).map((c) => c[0])).size > 1);
  if (!rows.length) {
    const e = el("div", "empty"); e.append(el("strong", null, state.kind === "hook" ? "No hooks in any client" : "Nothing here"), el("p", null, state.only === "all" ? "Hooks you add in Claude Code, Codex or Cursor will show up here." : "Try “All” to see every item."));
    main.append(e); return;
  }
  const table = el("table", "map");
  const cols = el("colgroup"); for (const w of ["38%", "20.6%", "20.6%", "20.6%"]) { const c = el("col"); c.style.width = w; cols.append(c); }
  table.append(cols);
  const head = el("thead"); const hr = el("tr"); hr.append(el("th", null, "Name"));
  for (const c of CLIENTS) { const th = el("th"); const chip = el("span", "chip"); chip.append(mark(c), el("span", null, c.name)); th.append(chip); hr.append(th); }
  head.append(hr); table.append(head);
  const body = el("tbody");

    const tr = el("tr"); tr.tabIndex = 0; tr.setAttribute("aria-selected", String(state.selected === item.name));
    const name = el("td"); const box = el("div", "item"); box.append(el("span", "mono", item.name));
    if (item.flag) box.append(el("span", item.info ? "flag info" : "flag", item.flag));
    name.append(box); tr.append(name);
    for (const c of CLIENTS) {
      const td = el("td");
      const change = state.changed && state.changed.name === item.name && state.changed.cells[c.id];
      const sock = socket(change ? change.from : item.cells[c.id]);
      td.append(sock); tr.append(td);
      if (change) setTimeout(() => morphSocket(sock, item.cells[c.id]), 260);
    }
    tr.addEventListener("click", () => openItem(item));
    tr.addEventListener("keydown", (e) => { if (e.key === "Enter") openItem(item, { keyboard: true }); });
    body.append(tr);
  }
  table.append(body); main.append(table);
  state.changed = null;
  const legend = el("div", "legend");
  for (const s of ["on", "off", "over", "gw", "unk"]) legend.append(socket([s]));
  main.append(legend);
  entrance([table]);
}

// The tab ink glides from the previous tab to the new one.
function placeInk(tabs, ink) {
  const active = tabs.querySelector('[aria-selected="true"]'); if (!active) return;
  const x = active.offsetLeft, w = active.offsetWidth;
  const to = `translateX(${x}px) scaleX(${w})`;
  ink.style.transform = to;
  if (state.ink && state.ink !== to) animate(ink, [{ transform: state.ink }, { transform: to }], { duration: 260, easing: "cubic-bezier(0.77, 0, 0.175, 1)" });
  state.ink = to;
}

function viewGateway(main) {
  main.append(el("h1", null, "Gateway"));
  main.append(el("p", "lede", "Turn MCP tools on and off in the gateway, not in each client. Here you see which clients reach it and what still goes around it."));
  const card = el("section", "card");
  const head = el("div", "gw-head");
  const left = el("div"); left.append(el("div", "kicker", "MetaMCP · no login"), el("div", "gw-url", "http://localhost:12008/metamcp/local/mcp"));
  const right = el("div"); const open = el("a", "btn", "Open MetaMCP ↗"); open.href = "#"; right.append(open);
  head.append(left, right); card.append(head);
  card.append(routeDiagram());
  main.append(card);

  const groups = [
    { title: "Can move into the gateway", note: "Direct entries for remote servers. Add them in MetaMCP, then remove them here.", rows: [["cx", "Neon", "~/.codex/config.toml"], ["cu", "Neon", "~/.cursor/mcp.json"], ["cx", "langfuse-data", "~/.codex/config.toml"], ["cu", "docs-langchain", "~/.cursor/mcp.json"]], action: "Remove…" },
    { title: "Must run on this Mac", note: "Local servers start a program here; a gateway cannot reach them. Nothing to do.", rows: [["cu", "n8n-mcp", "~/.cursor/mcp.json"], ["cx", "aseprite", "~/.codex/config.toml"], ["cx", "node_repl", "built into the Codex app"]] },
    { title: "Come with a plugin", note: "Turn the plugin off if you do not want them.", rows: [["cc", "playwright", "plugin superpowers"]] },
  ];
  const blocks = [card];
  for (const g of groups) {
    const t = el("h2", "group-title", `${g.title} · ${g.rows.length}`);
    const note = el("p", "group-note", g.note);
    const list = el("div", "list");
    for (const [cid, name, path] of g.rows) {
      const r = el("div", "list-row"); r.append(mark(CLIENTS.find((c) => c.id === cid)), el("span", "mono", name), el("span", "path mono", path));
      const act = el("span"); if (g.action) { const b = el("button", "btn small", g.action); b.type = "button"; b.addEventListener("click", () => openReview({ kind: "remove", name, cid })); act.append(b); }
      r.append(act); list.append(r);
    }
    const wrap = el("section"); wrap.append(t, note, list); main.append(wrap); blocks.push(wrap);
  }
  entrance(blocks);
}

// Three clients, one hub: dashes flow along each wire into the gateway.
function routeDiagram() {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 640 150"); svg.setAttribute("class", "routes"); svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "Claude Code, Codex and Cursor all connect to MetaMCP");
  const add = (tag, attrs, text) => { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (text) n.textContent = text; svg.append(n); return n; };
  const ys = [25, 75, 125], speeds = ["", "mid", "slow"], hub = { x: 470, y: 75 };
  CLIENTS.forEach((c, i) => {
    const d = `M 150 ${ys[i]} C 300 ${ys[i]}, 330 ${hub.y}, ${hub.x - 2} ${hub.y}`;
    add("path", { d, class: "wire" });
    add("path", { d, class: `flow ${speeds[i]}` });
    add("rect", { x: 8, y: ys[i] - 15, width: 142, height: 30, rx: 7, class: "node" });
    add("text", { x: 22, y: ys[i] + 4 }, c.mark);
    add("text", { x: 50, y: ys[i] + 4, class: "sub" }, c.name);
  });
  add("rect", { x: hub.x, y: hub.y - 22, width: 160, height: 44, rx: 9, class: "hub" });
  add("text", { x: hub.x + 14, y: hub.y - 2 }, "MetaMCP");
  add("text", { x: hub.x + 14, y: hub.y + 14, class: "sub" }, "3 clients · 1 tool");
  return svg;
}

function viewAgents(main) {
  main.append(el("h1", null, "Let agents see this setup"));

// Drawer: item details ------------------------------------------------------------------
function openItem(item, opts = {}) {
  if (!item) return;
  state.selected = item.name; render();
  const d = $("#drawer"); d.replaceChildren();
  const header = el("header"); const top = el("div", "top");
  top.append(el("span", "kicker", KINDS.find((k) => k.id === item.kind).label.replace(/s$/, "")));
  const close = el("button", "btn ghost small", "Close"); close.type = "button"; close.addEventListener("click", () => closeDrawer()); top.append(close);
  header.append(top, el("h1", "title-mono", item.name));
  const loads = CLIENTS.filter((c) => ["on", "gw"].includes(item.cells[c.id][0])).map((c) => c.name);
  header.append(el("p", "muted", loads.length ? `Loads in ${loads.join(" and ")}.` : "Does not load anywhere."));
  d.append(header);
  const body = el("div", "body");
  if (item.name === "superpowers" && item.cells.cu[1] === "claude") {
    const warn = el("div", "callout"); warn.append(el("span", null, "⚠"), el("span", null, "Cursor loads two copies: its own and the one from Claude Code. Turn off the Claude Code copy, or remove Cursor's."));
    body.append(warn);
  }
  for (const c of CLIENTS) {
    const [s] = item.cells[c.id]; if (s === "none") continue;
    const sec = el("section"); const t = el("div", "chip"); t.append(mark(c), el("h2", null, c.name)); sec.append(t);
    const stack = el("div", "stack");
    let layers = [[STATE_WORD[s], c.id === "cx" ? "~/.codex/config.toml" : c.id === "cu" ? "~/.cursor/mcp.json" : "~/.claude.json", "wins", WHERE[item.cells[c.id][1]] || "everywhere"]];
    if (item.name === "superpowers" && c.id === "cu") {
      layers = [["superpowers@cursor-public", "Cursor marketplace · everywhere", "wins", "Loads"]];
      if (item.cells.cu[1] === "claude") layers.push(["superpowers@claude-plugins-official", "~/.claude/plugins · via Claude Code", "wins", "Also loads"]);
    }
    if (item.name === "superpowers" && c.id === "cc") layers = [[`Everywhere · ${s === "on" ? "on" : "off"}`, "~/.claude/settings.json", s === "on" ? "wins" : "other", s === "on" ? "Loads" : "Off"], ["Project website · off", "work/website/.claude/settings.json", "other", "Only in website"]];
    for (const [name, path, kind, word] of layers) {
      const row = el("div", `layer ${kind}`);
      const m = el("span", `socket s-${kind === "wins" ? s : "off"}`); const dot = el("span", "dot"); m.append(dot); m.setAttribute("aria-hidden", "true"); row.append(m);
      const mid = el("div"); mid.append(el("div", "name mono", name), el("div", "why mono", path)); row.append(mid);
      row.append(el("span", kind === "wins" ? "badge win" : "badge", word)); stack.append(row);
    }
    sec.append(stack); body.append(sec);
  }
  if (item.secret) body.append(el("p", "muted", "This entry holds a secret. It is hidden here and never logged."));
  d.append(body);
  const footer = el("footer");
  footer.append(el("span", "note", "Install, update or move to another client:"));
  const cmds = el("button", "btn", "Commands…"); cmds.type = "button"; footer.append(cmds);
  if (item.kind === "plugin" && item.cells.cc[0] === "on") { const off = el("button", "btn primary", "Turn off in Claude Code…"); off.type = "button"; off.addEventListener("click", () => openReview({ kind: "plugin-off", name: item.name, cid: "cc" })); footer.append(off); }
  if (item.kind === "mcp" && item.flag === "Around gateway") { const rm = el("button", "btn primary", "Remove…"); rm.type = "button"; rm.addEventListener("click", () => openReview({ kind: "remove", name: item.name, cid: "cx" })); footer.append(rm); }
  d.append(footer); openDrawer(opts.keyboard);
}

// Drawer: review a change -------------------------------------------------------------
function openReview(change) {
  const client = CLIENTS.find((c) => c.id === change.cid);
  const plugin = change.kind === "plugin-off";
  const d = $("#drawer"); d.replaceChildren();
  const header = el("header"); const top = el("div", "top"); top.append(el("span", "kicker", "Review change"));
  const close = el("button", "btn ghost small", "Cancel"); close.type = "button"; close.addEventListener("click", () => closeDrawer()); top.append(close);
  header.append(top, el("h1", null, plugin ? `Turn off ${change.name} in ${client.name}` : `Remove ${change.name} from ${client.name}`));
  header.append(el("p", "muted", "Nothing is written until you press Apply. A backup is kept, so you can undo."));
  d.append(header);
  const body = el("div", "body");
  const step = el("div", "step"); const sh = el("div", "step-head"); sh.append(mark(client), el("strong", null, client.name), el("span", "file mono", plugin ? "~/.claude/settings.json" : "~/.codex/config.toml"));
  const pre = el("pre", "diff");
  const lines = plugin
    ? [["", '"enabledPlugins": {'], ["del", '-  "superpowers@claude-plugins-official": true'], ["add", '+  "superpowers@claude-plugins-official": false'], ["", "}"]]
    : [["del", `-[mcp_servers.${change.name}]`], ["del", '-url = "https://mcp.neon.tech/mcp"']];
  for (const [cls, text] of lines) pre.append(el("span", cls, text + "\n"));
  step.append(sh, pre); body.append(step);
  if (plugin) body.append(el("p", "muted", "Runs Claude Code's own command: claude plugin disable superpowers@claude-plugins-official -s user"));
  const after = el("section"); after.append(el("h2", null, "After you apply"));
  const ul = el("ul", "checklist"); ul.append(el("li", null, plugin ? "Run /reload-plugins in Claude Code, or start a new session." : "Restart Codex (the app and open CLI sessions).")); after.append(ul); body.append(after);
  d.append(body);
  const footer = el("footer"); footer.append(el("span", "note", "⌘ Enter to apply"));
  const cancel = el("button", "btn", "Cancel"); cancel.type = "button"; cancel.addEventListener("click", () => closeDrawer());
  const apply = el("button", "btn primary"); apply.type = "button";
  const label = el("span", "label", "Apply"); apply.append(label);
  apply.addEventListener("click", () => applyChange(change, apply, label));
  footer.append(cancel, apply); d.append(footer); openDrawer();
}

// Apply: the button morphs Apply → Applying… (spinner) → Applied (check draws), then the
// panel leaves and the page shows the effect where it happened.
function applyChange(change, button, label) {
  button.disabled = true;
  label.classList.add("swap");
  setTimeout(() => {
    label.textContent = "Applying…"; button.prepend(el("span", "spinner")); label.classList.remove("swap");
  }, 120);
  setTimeout(() => {
    button.querySelector(".spinner").remove();
    const NS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(NS, "svg"); svg.setAttribute("viewBox", "0 0 14 14"); svg.setAttribute("width", "12"); svg.setAttribute("height", "12"); svg.setAttribute("class", "check");
    const p = document.createElementNS(NS, "path"); p.setAttribute("d", "M2.5 7.5 L5.8 10.5 L11.5 3.5"); p.setAttribute("fill", "none"); p.setAttribute("stroke", "currentColor"); p.setAttribute("stroke-width", "1.8"); p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");
    svg.append(p); button.prepend(svg); label.textContent = "Applied";
  }, 900);
  setTimeout(() => {
    closeDrawer({ keep: true });
    if (change.kind === "plugin-off") effectPluginOff();
    toast(change.kind === "plugin-off" ? `Turned off ${change.name} · reload plugins in Claude Code` : `Removed ${change.name} · restart Codex`, change);
  }, 1350);
}

function effectPluginOff() {
  const item = ITEMS.find((i) => i.name === "superpowers");
  state.undo = { cells: JSON.parse(JSON.stringify(item.cells)), flag: item.flag, attention: ATTENTION.slice() };
  state.changed = { name: item.name, cells: { cc: { from: item.cells.cc }, cu: { from: item.cells.cu } } };
  item.cells = { cc: ["off", "you"], cx: ["none"], cu: ["on", "you"] };
  delete item.flag;
  ATTENTION = ATTENTION.filter((a) => a.id !== "sp");
  CHANGES.unshift(["Today 18:51", "Turned superpowers off · Claude Code", "Applied", true]);
  state.selected = item.name; render();
  rollTo($("#nav-attn"), ATTENTION.length);
  rollTo($("#nav-changes"), CHANGES.length);
}
function undoPluginOff() {
  if (!state.undo) return;
  const item = ITEMS.find((i) => i.name === "superpowers");
  state.changed = { name: item.name, cells: { cc: { from: item.cells.cc }, cu: { from: item.cells.cu } } };
  item.cells = state.undo.cells; item.flag = state.undo.flag; ATTENTION = state.undo.attention; state.undo = null;
  CHANGES.shift();
  render();
  rollTo($("#nav-attn"), ATTENTION.length);
  rollTo($("#nav-changes"), CHANGES.length);
}

function openDrawer(instant) {
  for (const n of [$("#drawer"), $("#scrim")]) { n.classList.toggle("instant", Boolean(instant)); n.classList.add("open"); }
  $("#drawer").focus();
}
// Keyboard closes are instant: an action done hundreds of times a day must not wait.
function closeDrawer({ instant = false, keep = false } = {}) {
  for (const n of [$("#drawer"), $("#scrim")]) { n.classList.toggle("instant", instant); n.classList.remove("open"); }
  if (!keep) { state.selected = null; render(); }
}
function toast(text, change) {
  const t = $("#toast"); t.classList.remove("show"); t.replaceChildren(el("span", null, text));
  const u = el("button", "btn small", "Undo"); u.type = "button";
  u.addEventListener("click", () => { t.classList.remove("show"); if (change.kind === "plugin-off") undoPluginOff(); });
  t.append(u, el("span", "timer"));
  void t.offsetWidth; t.classList.add("show");
  clearTimeout(toast.timer);
  const hide = () => { toast.timer = setTimeout(() => t.classList.remove("show"), 6000); };
  t.onmouseenter = () => clearTimeout(toast.timer); t.onmouseleave = hide; hide();
}

// Shell ----------------------------------------------------------------------------------
const VIEWS = { overview: viewOverview, map: viewMap, gateway: viewGateway, changes: viewChanges, agents: viewAgents };
function render() {
  const main = $("#main"); main.replaceChildren();
  VIEWS[state.view](main);
  state.seen.add(state.view);
  for (const a of document.querySelectorAll(".nav a")) {
    if (a.dataset.view === state.view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  }
  document.title = `${{ overview: "Overview", map: "Load map", gateway: "Gateway", changes: "Changes", agents: "Agents" }[state.view]} · Agent setup`;
}
function go(view, opts = {}) {
  const next = VIEWS[view] ? view : "overview";
  if (opts.kind) state.kind = opts.kind;
  if (next === state.view) { render(); return; }
  transition(() => {
    state.view = next; state.ink = null;
    closeDrawer({ instant: true, keep: true }); render(); $(".content").scrollTop = 0;
  });
  try { history.replaceState(null, "", "#" + next); } catch { /* file snapshots */ }
}
document.addEventListener("click", (e) => {
  const link = e.target.closest("a[data-view]");
  if (link) { e.preventDefault(); go(link.dataset.view); }
});
$("#scrim").addEventListener("click", () => closeDrawer());
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("#drawer").classList.contains("open")) closeDrawer({ instant: true });
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
});

// Theme switch: the new theme spreads in a circle from the button (a rare action, so it may delight).
function setTheme(dark) {
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("#theme").textContent = dark ? "Light theme" : "Dark theme";
}
$("#theme").addEventListener("click", (e) => {
  const dark = document.documentElement.dataset.theme !== "dark";
  const t = transition(() => setTheme(dark), "theme-switch");
  if (!t) return;
  const x = e.clientX || innerWidth / 2, y = e.clientY || innerHeight / 2;
  const r = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  t.ready.then(() => document.documentElement.animate(
    { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${r}px at ${x}px ${y}px)`] },
    { duration: 520, easing: "cubic-bezier(0.77, 0, 0.175, 1)", pseudoElement: "::view-transition-new(root)" },
  )).catch(() => {});
});

// Rescan: a line sweeps under the top bar; the time rolls to the new value.
$("#rescan").addEventListener("click", () => {
  const bar = $("#topbar"); bar.classList.add("scanning");
  setTimeout(() => { bar.classList.remove("scanning"); $("#scanned").textContent = "18:52"; }, 1100);
});

if (matchMedia("(prefers-color-scheme: dark)").matches) setTheme(true);
state.view = (location.hash.slice(1) || "overview"); if (!VIEWS[state.view]) state.view = "overview";
render();
</script>
