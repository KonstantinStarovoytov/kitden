  <title>Kitden</title>
  <style>
.light { opacity: 0; animation: light 10510ms 400ms infinite; }
.puff { opacity: 0; transform-origin: 0 0; animation: puff 10510ms linear infinite; }
@keyframes light {
  0% { opacity: 0; animation-timing-function: cubic-bezier(.45, 0, .25, 1); }
  11.418% { opacity: 1; animation-timing-function: linear; }
  36.251% { opacity: 1; animation-timing-function: ease-in-out; }
  42.912%, 100% { opacity: 0; }
}
@keyframes puff {
  0% { opacity: 0; transform: translate(0px, 6.05px) scale(0.7); filter: blur(1.5px); }
  4.948% { opacity: 0.31; transform: translate(17.1px, -20.16px) scale(0.84); filter: blur(1.7px); }
  14.843% { opacity: 0.22; transform: translate(68.4px, -39.31px) scale(1.12); filter: blur(2.1px); }
  24.738%, 100% { opacity: 0; transform: translate(114px, -46.37px) scale(1.4); filter: blur(2.5px); }
}
@media (prefers-reduced-motion: reduce) {
  .light, .puff { animation: none; }
}
  </style>
