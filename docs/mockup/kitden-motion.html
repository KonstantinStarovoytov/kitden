<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitden Motion Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the Kitden window (rail · top bar · page) inside a 16px gutter. Maps are fixed-coordinate trees that scroll inside their own stage. Tokens are the kd-* values from design/kitden.pen. */
:root{
  --out:#0D0F13; --canvas:#171A20; --panel:#20242C; --raised:#282D36; --inset:#12151A; --dim:#1B1F26;
  --ink:#F2F3F5; --ink-2:#C1C6CF; --muted:#A5ADBA; --faint:#6B7381;
  --line:#3B424D; --wire:#59616F; --accent:#F09A7C; --action:#B34B2D; --action-hover:#9F4025;
  --select:#382A27; --ok:#47C27A; --ok-fill:#47C27A; --on-ok:#0B1A12; --warn:#EAC27C;
  --preview-fill:#F09A7C10; --preview-line:#F09A7C80; --glow:240 154 124; --beam:#FFE3D6;
  --shim:rgb(255 255 255 / .06); --shadow:0 18px 44px -14px rgb(0 0 0 / .7);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --spring:linear(0,0.0066,0.0263 2.4%,0.1061 5%,0.2289 7.7%,0.6235 15.9%,0.7837 20.1%,0.8986 24.5%,0.9775 29.4%,1.0122 33.2%,1.031 37.5%,1.0337 42.7%,1.0242 49.5%,1.0048 61.8%,0.9989 75.4%,1);
  --slow:1;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --out:#E4E7EC; --canvas:#F5F6F8; --panel:#FFFFFF; --raised:#FFFFFF; --inset:#F0F2F5; --dim:#EEF0F3;
  --ink:#161A21; --ink-2:#464D5B; --muted:#646B79; --faint:#80868F;
  --line:#E1E4E9; --wire:#C3C8D0; --accent:#A44226; --action:#B34B2D; --action-hover:#9F4025;
  --select:#F6E8E2; --ok:#1C8A4C; --ok-fill:#177A42; --on-ok:#FFFFFF; --warn:#97590A;
  --preview-fill:#A4422612; --preview-line:#A4422680; --glow:196 84 50; --beam:#C2502E;
  --shim:rgb(0 0 0 / .05); --shadow:0 18px 44px -18px rgb(26 31 42 / .28); color-scheme:light}}
:root[data-theme="light"]{
  --out:#E4E7EC; --canvas:#F5F6F8; --panel:#FFFFFF; --raised:#FFFFFF; --inset:#F0F2F5; --dim:#EEF0F3;
  --ink:#161A21; --ink-2:#464D5B; --muted:#646B79; --faint:#80868F;
  --line:#E1E4E9; --wire:#C3C8D0; --accent:#A44226; --action:#B34B2D; --action-hover:#9F4025;
  --select:#F6E8E2; --ok:#1C8A4C; --ok-fill:#177A42; --on-ok:#FFFFFF; --warn:#97590A;
  --preview-fill:#A4422612; --preview-line:#A4422680; --glow:196 84 50; --beam:#C2502E;
  --shim:rgb(0 0 0 / .05); --shadow:0 18px 44px -18px rgb(26 31 42 / .28); color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--out);color:var(--ink);font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
.ic{flex:none;display:inline-block;vertical-align:middle}
.app{height:100%;min-height:560px;display:grid;grid-template-columns:148px minmax(0,1fr);background:var(--canvas);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}

/* Rail */
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:26px;padding:20px 12px 18px;min-height:0}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:19px;letter-spacing:-.015em;padding:2px 6px}
.logo svg{width:28px;height:28px}
.nav{position:relative;display:flex;flex-direction:column;gap:6px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:8px;color:var(--ink-2);position:relative;z-index:1;transition:color calc(.18s*var(--slow))}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600}
.nav button:focus-visible,.btn:focus-visible,.seg button:focus-visible,.nd:focus-visible,.appearance:focus-visible,.tg:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav-mark{position:absolute;left:0;right:0;top:0;height:38px;border-radius:8px;background:var(--select);border:1px solid rgb(var(--glow) / .3);box-shadow:inset 2px 0 0 #C85835}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:14px;padding:0 8px;font-size:11px;color:var(--muted)}
.appearance{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);border-radius:6px}

/* Column, top bar, page */
.col{position:relative;display:grid;grid-template-rows:66px minmax(0,1fr);min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:18px;padding:0 18px 0 22px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
.find{display:flex;align-items:center;gap:8px;flex:1;min-width:80px;color:var(--muted)}
.find input{all:unset;flex:1;min-width:0;font-size:12px;color:var(--ink)}
.find input::placeholder{color:var(--muted)}
.studio{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);white-space:nowrap}
.tg{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:6px;border:1px solid var(--line);font-size:11px;color:var(--muted);transition:background-color calc(.18s*var(--slow)),color calc(.18s*var(--slow)),border-color calc(.18s*var(--slow))}
.tg[aria-pressed="true"]{background:var(--select);color:var(--accent);border-color:rgb(var(--glow) / .45)}
#panel-host{display:contents}
.sw{display:inline-block}
.itile{position:relative}
#dots{position:absolute;left:0;right:0;top:66px;bottom:0;width:100%;height:calc(100% - 66px);pointer-events:none;z-index:0}
main{position:relative;z-index:1;overflow:auto;padding:26px 22px 64px;min-width:0;min-height:0}
.hintline{position:absolute;left:22px;right:22px;bottom:14px;z-index:2;display:flex;justify-content:space-between;gap:16px;font-size:11px;color:var(--muted);pointer-events:none}
.hintline span:first-child{display:flex;gap:6px;align-items:center;min-width:0}
.hintline span:last-child{color:var(--faint)}

.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.018em;text-wrap:balance}
h1 .w,.lede .w{display:inline-block}
.lede{margin:4px 0 0;font-size:12px;color:var(--muted)}
.scope{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:11px;color:var(--muted)}
.head-acts{display:flex;align-items:center;gap:10px}
.chip{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 8px;white-space:nowrap}
.seg{position:relative;display:flex;gap:2px;padding:2px;background:var(--inset);border:1px solid var(--line);border-radius:7px}
.seg button{all:unset;cursor:pointer;position:relative;z-index:1;padding:4px 11px;border-radius:5px;font-size:12px;color:var(--muted);transition:color calc(.18s*var(--slow))}
.seg button[aria-pressed="true"]{color:var(--ink);font-weight:500}
.seg .seg-mark{position:absolute;top:2px;bottom:2px;left:2px;width:40px;border-radius:5px;background:var(--raised);box-shadow:0 1px 2px rgb(0 0 0 / .25)}
.seg.sm button{padding:3px 8px;font-size:11px}

/* Buttons */
.btn{all:unset;cursor:pointer;position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--raised);color:var(--ink);font-size:12px;font-weight:500;white-space:nowrap;transition:background-color calc(.18s*var(--slow)),border-color calc(.18s*var(--slow)),color calc(.18s*var(--slow)),scale calc(.26s*var(--slow)) var(--spring)}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.btn:active{scale:.97}
.btn.primary{background:var(--action);border-color:var(--action);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--action-hover);border-color:var(--action-hover)}
.btn.ok{background:var(--ok-fill);border-color:var(--ok-fill);color:var(--on-ok)}
.btn.sm{padding:4px 9px;font-size:11px}
.btn.xs{padding:2px 7px;font-size:11px;border-radius:6px;gap:4px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn .meter{position:absolute;left:0;bottom:0;height:2px;width:100%;background:rgb(255 255 255 / .75);transform:scaleX(0);transform-origin:left}
.rich .btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgb(255 255 255 / .28) 50%,transparent 65%);transform:translateX(-130%);pointer-events:none}
.rich .btn.primary:hover::after{transform:translateX(130%);transition:transform calc(.75s*var(--slow)) ease}
.spin{animation:rot calc(.8s*var(--slow)) linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* Map */
.stage{position:relative;margin-top:22px;overflow-x:auto;overflow-y:hidden;padding:6px 6px 10px 6px;margin-left:-6px}
.map{position:relative;flex:none}
.map svg.links{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.map .layer{position:absolute;inset:0}
.nd{position:absolute;left:0;top:0;transform-origin:center;will-change:transform}
.cap{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap}
.cap.grp{font-weight:600;color:var(--ink-2)}
.blk{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:border-color calc(.18s*var(--slow)),background-color calc(.18s*var(--slow)),box-shadow calc(.3s*var(--slow)),filter calc(.3s*var(--slow)),scale calc(.26s*var(--slow)) var(--spring)}
.blk:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
.blk:active{scale:.98}
.blk .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.blk b{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
.blk small{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);white-space:nowrap}
.tile{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:#12151A;object-fit:contain;flex:none;display:block}
.tile.pad{padding:4px}
.tile.sm{width:20px;height:20px;border-radius:5px}
.tile.sm.pad{padding:3px}
.itile{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--inset);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.lamp{width:6px;height:6px;border-radius:50%;background:var(--faint);display:inline-block;flex:none;transition:background-color calc(.4s*var(--slow))}
.lamp.on{background:var(--ok)}
.lamp.warn{background:var(--warn)}
.port{position:absolute;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--canvas);border:1.5px solid var(--wire);transition:border-color calc(.2s*var(--slow)),opacity calc(.2s*var(--slow)),scale calc(.3s*var(--slow)) var(--spring)}
.port.r{right:-5px}
.port.l{left:-5px}
.port.amber{border-color:var(--faint)}
.blk.lit .port:not(.amber),.blk.sel .port{border-color:var(--accent)}
.badge{position:absolute;right:-10px;top:50%;margin-top:-10px;width:20px;height:20px;border-radius:50%;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center;font-size:10px;color:var(--ink-2);transition:scale calc(.3s*var(--slow)) var(--spring),opacity calc(.2s*var(--slow))}
.srv .port.r{opacity:0;scale:.4}
.srv.open{border-color:var(--accent)}
.srv.open .badge{opacity:0;scale:.3}
.srv.open .port.r{opacity:1;scale:1;border-color:var(--accent)}
.gw{flex-direction:column;justify-content:center;gap:1px;text-align:center;background:var(--raised);border-color:var(--accent);padding:10px}
.gw b{font-size:13px}
.gw .house svg{width:26px;height:26px;display:block;margin:0 auto 4px}
.stats{display:flex;justify-content:center;gap:10px;margin-top:7px;font-size:11px;color:var(--ink-2)}
.stats>span{display:inline-flex;align-items:center;gap:4px}
.stats em{font-style:normal;white-space:nowrap}
.tool{gap:9px;padding:0 10px}
.tool span{font-size:12px;color:var(--ink)}
.tool .kind{margin-left:auto;font-size:10.5px;color:var(--faint)}
.mark{width:6px;height:6px;border-radius:50%;background:var(--faint);display:inline-block;flex:none;transition:background-color calc(.4s*var(--slow))}
.mark.on{background:var(--ok)}
.mark.pv{background:transparent;border:1.5px dashed var(--accent)}
.out{background:var(--dim)}
.grip{display:grid;color:var(--faint);cursor:grab;margin-right:-4px}
.out .oic{color:var(--ink-2);display:grid}
.blk.sel{background:var(--select);border-color:var(--accent)}
.blk.preview{background:var(--preview-fill);border:1px dashed var(--preview-line)}
.blk.preview small{color:var(--accent)}
.blk.client.free{cursor:grab}
.blk.lift{box-shadow:var(--shadow);border-color:var(--accent);cursor:grabbing;z-index:5}
.slot{border:1px dashed var(--preview-line);border-radius:8px;background:var(--preview-fill)}
.map.focus .nd.blk:not(.lit):not(.sel){filter:opacity(.4) saturate(.6)}
.map.find .nd.blk.miss{filter:opacity(.3) saturate(.5) blur(1.2px)}
.lk{fill:none;stroke:var(--wire);stroke-width:1.2;stroke-linecap:round;transition:stroke calc(.22s*var(--slow)),stroke-opacity calc(.3s*var(--slow)),stroke-width calc(.22s*var(--slow))}
.lk.direct{stroke:var(--faint);stroke-opacity:.8;stroke-dasharray:1.5 4}
.lk.preview{stroke:var(--accent);stroke-opacity:.65;stroke-dasharray:4 4}
.rich .lk.preview{animation:march calc(1.1s*var(--slow)) linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
.lk.on{stroke:var(--accent);stroke-width:1.7}
.lk.direct.on{stroke:var(--muted);stroke-opacity:1}
.map.focus .lk:not(.on){stroke-opacity:.16}
.map.find .lk{stroke-opacity:.2}
.ov{fill:none;stroke:var(--accent);stroke-width:2.1;stroke-linecap:round}
.beam{fill:none;stroke:var(--beam);stroke-width:2.6;stroke-linecap:round}
.beam.amber{stroke:var(--warn)}
/* Spotlight border and glow that follow the pointer (Magic Card / Spotlight Card) */
.rich .blk::before,.rich .card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:radial-gradient(130px circle at var(--mx,-300px) var(--my,-300px),rgb(var(--glow) / .85),transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:0;transition:opacity calc(.25s*var(--slow));pointer-events:none}
.rich .blk::after,.rich .card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(200px circle at var(--mx,-300px) var(--my,-300px),rgb(var(--glow) / .08),transparent 65%);opacity:0;transition:opacity calc(.25s*var(--slow));pointer-events:none}
.rich .blk:hover::before,.rich .blk:hover::after,.rich .card:hover::before,.rich .card:hover::after{opacity:1}
/* Border beam on a block waiting for Apply */
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
.bb{display:none;position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--a),transparent 0 70%,rgb(var(--glow)) 86%,var(--beam) 91%,transparent 97%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:spinA calc(2.4s*var(--slow)) linear infinite;pointer-events:none}
.rich .preview .bb{display:block}
@keyframes spinA{to{--a:360deg}}
.ripple{position:absolute;inset:-1px;border-radius:inherit;pointer-events:none}
.spark{position:fixed;width:12px;height:2px;margin-top:-1px;border-radius:2px;transform-origin:0 50%;pointer-events:none;z-index:300}
.flier{position:fixed!important;z-index:60;pointer-events:none;overflow:hidden}

/* List view */
.list{width:912px;font-size:12px}
.lh,.lr{display:grid;grid-template-columns:minmax(0,1fr) 130px 150px 100px;align-items:center;gap:12px;padding:0 12px}
.lh{height:30px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}
.lg{display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;font-size:11px;font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--line)}
.lr{height:40px;border-bottom:1px solid var(--line);cursor:pointer;transition:background-color calc(.18s*var(--slow))}
.lr:hover{background:var(--dim)}
.lr.sub{height:34px;padding-left:44px}
.lr.sel{background:var(--select)}
.lr .nm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.lr.sub .nm{font-weight:400}
.lr .by{display:flex;gap:4px}
.lr .end{display:flex;justify-content:flex-end}

/* Side panel, dock */
.panel{position:absolute;right:22px;top:190px;bottom:46px;width:min(320px,calc(100% - 44px));z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);overflow:auto}
.p-kick{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--faint)}
.x{all:unset;cursor:pointer;display:grid;place-items:center;width:24px;height:24px;border-radius:6px;color:var(--muted)}
.x:hover{background:var(--dim);color:var(--ink)}
.p-title{font-size:17px;font-weight:600;letter-spacing:-.01em}
.p-id{font:11px/1.5 var(--mono);color:var(--muted)}
.facts{display:grid;grid-template-columns:94px minmax(0,1fr);gap:11px 8px;margin:0;padding:12px 0;border-block:1px solid var(--line);font-size:12px}
.facts dt{font-size:11px;color:var(--muted)}
.facts dd{margin:0;display:flex;align-items:center;gap:6px;min-width:0}
.p-say{margin:0;font-size:12px;color:var(--ink-2)}
.p-acts{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.p-tech{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.p-lines{font:11px/1.6 var(--mono);color:var(--ink-2);background:var(--inset);border:1px solid var(--line);border-radius:6px;padding:10px 12px;white-space:pre-wrap}
.p-hist{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;color:var(--muted);align-items:center}
.p-hist span.on{color:var(--ink)}
.sk{display:block;height:10px;border-radius:5px;background:var(--raised);position:relative;overflow:hidden}
.rich .sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--shim),transparent);transform:translateX(-100%);animation:shim calc(1.1s*var(--slow)) ease-in-out infinite}
@keyframes shim{to{transform:translateX(100%)}}
.search{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--inset);color:var(--muted)}
.search input{all:unset;flex:1;min-width:0;font-size:12px;color:var(--ink)}
.res-g{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ink-2);margin-top:4px}
.res{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;transition:border-color calc(.18s*var(--slow)),background-color calc(.18s*var(--slow))}
.res:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.res.on{background:var(--select);border-color:var(--accent)}
.res.off{opacity:.55;cursor:default}
.res.dragging{opacity:.4}
.flier.ghost{box-shadow:var(--shadow);cursor:grabbing}
.flier.ghost.over{border-color:var(--accent);background:var(--select)}
.res .tx{display:flex;flex-direction:column;flex:1;min-width:0}
.res b{font-size:12px}
.res small{font-size:11px;color:var(--muted)}
.res .st{font-size:11px;color:var(--faint)}
.res.on .st{color:var(--accent)}
.res .st.okc{color:var(--ok)}
.dock{position:absolute;left:22px;bottom:46px;z-index:25;max-width:calc(100% - 44px)}
.bar{display:flex;align-items:center;gap:14px;width:380px;max-width:100%;padding:14px 14px 14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.bar.err{border-color:var(--accent)}
.bar .tx{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.bar b{font-size:13px;font-weight:600}

.row .t{position:relative;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.crumb{margin-right:auto;margin-left:6px}
.p-kick .x{margin:-4px}

.sw-head{font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:6px}

.tray-list .tt small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray-list .ts{display:grid;place-items:center;width:14px;color:var(--muted)}

.x[disabled]{opacity:.35;pointer-events:none}

.map .layer{pointer-events:none}
.map .nd{pointer-events:auto}

.edge-x::before{content:'';position:absolute;inset:-6px;border-radius:50%}
.edge-x:hover{background:var(--accent);color:var(--panel)}
.edge-x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.blk.leaving{filter:opacity(.45);border-style:dashed}

.chk{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--wire);display:grid;place-items:center;flex:none;color:var(--panel);transition:background-color calc(.2s*var(--slow)),border-color calc(.2s*var(--slow))}
.chk svg{opacity:0;transform:scale(.5);stroke-width:3;transition:opacity calc(.16s*var(--slow)),transform calc(.32s*var(--slow)) var(--spring)}
.pick.on .chk{background:var(--accent);border-color:var(--accent)}

.pick.multi.on{background:var(--select);border-color:var(--accent)}
@media (max-width:900px){

  $$('.mi',menuEl).forEach(b=>b.addEventListener('click',()=>{closeMenu();setProject(b.dataset.p||null)}));
  const q=$('#pq',menuEl);q.addEventListener('input',()=>{const v=q.value.toLowerCase();$$('.mi',menuEl).forEach(b=>b.hidden=!!v&&!(b.dataset.p||'all projects').includes(v))});q.focus();
  document.addEventListener('pointerdown',outsideMenu,true)});
