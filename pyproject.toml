[project]
name = "kitden"
version = "0.1.0"
description = "See and safely change what AI coding clients load on this computer."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["claude-code", "codex", "cursor", "mcp", "plugins", "skills"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = [
    "mcp>=2.3",
    "starlette>=1.8",
    "uvicorn>=0.54",
    "tomlkit>=0.15",
    "watchfiles>=1.3",
]

[project.scripts]
kitden = "kitden.cli:main"

[project.urls]
Homepage = "https://github.com/KonstantinStarovoytov/kitden"
Repository = "https://github.com/KonstantinStarovoytov/kitden"
Releases = "https://github.com/KonstantinStarovoytov/kitden/releases"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "hypothesis>=6.170",
    "syrupy>=6.1",
    "ruff>=0.16",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitden"]

[tool.hatch.build.targets.sdist]
only-include = ["src/kitden", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not contract'"
markers = [
    "contract: tests against real installed clients in sandbox homes (local only)",
]
