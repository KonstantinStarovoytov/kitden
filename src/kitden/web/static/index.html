<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitden</title>
  <link rel="icon" type="image/svg+xml" href="/static/brand/kitden.svg">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <nav class="rail" aria-label="Main">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="label">Kitden</span></div>
      <div class="nav">
        <a href="#overview" data-view="overview"><span class="label">Overview</span><span class="count warn roll" id="nav-attention"></span></a>
        <a href="#library" data-view="library"><span class="label">Library</span></a>
        <a href="#gateway" data-view="gateway"><span class="label">Gateway</span></a>
        <a href="#changes" data-view="changes"><span class="label">Changes</span><span class="count roll" id="nav-changes"></span></a>
      </div>
      <div class="rail-foot">
        <div class="scan-line"><span>Scanned <span id="scanned">…</span></span><button class="btn ghost small" type="button" id="rescan">Rescan</button></div>
        <a href="#agents" data-view="agents" class="muted">Let agents read this setup</a>
        <button class="appearance" type="button" id="theme"><span class="label">Appearance</span></button>
      </div>
    </nav>

    <div class="content" id="content">
      <div class="topbar" id="topbar">
        <div class="where-box" id="where-box">
          <button class="where" id="where" type="button" aria-label="Project" aria-haspopup="listbox" aria-expanded="false" disabled><span class="where-word">Project</span><span class="where-name">…</span></button>
        </div>
        <label class="search">
          <input id="q" type="search" placeholder="Search your setup and marketplaces…" aria-label="Search your setup and marketplaces" autocomplete="off" spellcheck="false">
          <span class="find-chip" id="find-chip" role="status"></span>
          <span class="kbd" aria-hidden="true">/</span>
        </label>
        <span class="scan-status" id="scan-status" role="status"></span>
      </div>
      <main id="main" class="page" tabindex="-1"></main>
      <div class="hint-dock"><div class="dock" id="dock"></div><p class="hint-line" id="hint" hidden></p></div>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Details" tabindex="-1"></aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
