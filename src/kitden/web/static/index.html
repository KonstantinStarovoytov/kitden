<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitden</title>
  <link rel="icon" type="image/svg+xml" href="/static/brand/kitden.svg">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <nav class="rail" aria-label="Main">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Kitden</div>
      <div class="nav">
        <a href="#overview" data-view="overview">Overview <span class="count warn roll" id="nav-attention"></span></a>
        <a href="#library" data-view="library">Library</a>
        <a href="#gateway" data-view="gateway">Gateway</a>
        <a href="#changes" data-view="changes">Changes <span class="count roll" id="nav-changes"></span></a>
      </div>
      <div class="rail-foot">
        <span>Scanned <span id="scanned">…</span> · <button class="btn ghost small" type="button" id="rescan">Rescan</button></span>
        <a href="#agents" data-view="agents" class="muted">Let agents read this setup</a>
        <button class="btn small" type="button" id="theme">Dark theme</button>
      </div>
    </nav>

    <div class="content" id="content">
      <div class="topbar" id="topbar">
        <label class="where-box">
          <span class="muted">Project:</span>
          <select id="where" aria-label="Project"><option value="">Global</option></select>
        </label>
        <label class="search">
          <span aria-hidden="true">⌕</span>
          <input id="q" type="search" placeholder="Search your setup and marketplaces…" aria-label="Search your setup and marketplaces" autocomplete="off" spellcheck="false">
          <span class="kbd" aria-hidden="true">/</span>
        </label>
        <span class="scan-status" id="scan-status" role="status" aria-live="polite"></span>
      </div>
      <main id="main" class="page" tabindex="-1"></main>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Details" tabindex="-1"></aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
