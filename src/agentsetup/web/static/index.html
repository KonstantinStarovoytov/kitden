<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent setup</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header>
    <h1>Agent setup</h1>
    <p class="hint">What Claude Code, Codex and Cursor load on this computer. Read-only.</p>
    <button id="rescan" type="button">Rescan</button>
    <span id="status" class="hint" aria-live="polite"></span>
  </header>

  <main>
    <section aria-labelledby="clients-title">
      <h2 id="clients-title">Clients</h2>
      <ul id="clients" class="clients"></ul>
    </section>

    <section aria-labelledby="project-title">
      <h2 id="project-title">Project</h2>
      <div class="filters">
        <label>Project <select id="project"><option value="">Outside any project</option></select></label>
        <span id="project-note" class="hint"></span>
      </div>
      <div id="project-views" class="views"></div>
    </section>

    <section aria-labelledby="findings-title">
      <h2 id="findings-title">Findings</h2>
      <ul id="findings" class="findings"></ul>
    </section>

    <section id="problems-section" aria-labelledby="problems-title" hidden>
      <h2 id="problems-title">Could not read</h2>
      <ul id="problems"></ul>
    </section>

    <section aria-labelledby="items-title">
      <h2 id="items-title">Items</h2>
      <div class="filters">
        <label>Client <select id="filter-client"><option value="">All</option></select></label>
        <label>Kind <select id="filter-kind"><option value="">All</option></select></label>
        <label>Search <input id="filter-text" type="search" placeholder="Name or path"></label>
        <span id="count" class="hint"></span>
      </div>
      <table>
        <thead>
          <tr>
            <th>Client</th><th>Kind</th><th>Name</th><th>Scope</th><th>Project</th>
            <th>State</th><th>Source</th>
          </tr>
        </thead>
        <tbody id="items"></tbody>
      </table>
    </section>
  </main>
</body>
</html>
