<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent setup</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <nav class="rail" aria-label="Main">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Agent setup</div>
      <div class="nav">
        <a href="#overview" data-view="overview">Overview <span class="count warn roll" id="nav-attention"></span></a>
        <a href="#map" data-view="map">Load map <span class="count" id="nav-items"></span></a>
        <a href="#gateway" data-view="gateway">Gateway <span class="count" id="nav-around"></span></a>
        <a href="#changes" data-view="changes">Changes <span class="count roll" id="nav-changes"></span></a>
      </div>
      <div class="rail-foot">
        <span>Scanned <span id="scanned">…</span> · <button class="btn ghost small" type="button" id="rescan">Rescan</button></span>
        <span>Agents can ask: <a href="#agents" data-view="agents" class="muted">show my setup</a></span>
        <button class="btn small" type="button" id="theme">Dark theme</button>
      </div>
    </nav>

    <div class="content" id="content">
      <div class="topbar" id="topbar">
        <label class="where">
          <span class="muted">Where:</span>
          <select id="where" aria-label="Where to look"><option value="">Everywhere</option></select>
        </label>
        <label class="search">
          <span aria-hidden="true">⌕</span>
          <input id="q" type="search" placeholder="Find an MCP server, skill or plugin…" aria-label="Find an item" autocomplete="off" spellcheck="false">
          <span class="kbd" aria-hidden="true">/</span>
        </label>
      </div>
      <main id="main" class="page" tabindex="-1"></main>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Details" tabindex="-1"></aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
